name: Regenerate trigger-weights

on:
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Create a Pull Request when changes are detected (manual runs only)'
        required: false
        default: 'true'
  schedule:
    # weekly on Sunday at 03:00 UTC
    - cron: '0 3 * * 0'

# Minimal read permissions — workflow will not push or create PRs.
permissions:
  contents: read
  pull-requests: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate trigger weights
        run: |
          echo "Generating trigger weights"
          npm run gen:triggers

      - name: Check for changes
        id: check_changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          git add config/trigger-weights.json || true
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Exit early when no changes
        if: steps.check_changes.outputs.changed == 'false'
        run: |
          echo "No changes detected; nothing to push or create. Exiting."
          exit 0

      - name: Create Pull Request with regenerated config
        if: steps.check_changes.outputs.changed == 'true' && (github.event.inputs.create_pr == 'true' || github.event_name == 'schedule')
        # Note: using the third-party action `peter-evans/create-pull-request@v5` to create a PR.
        # This does NOT make "peter-evans" the author — the PR/commit author is determined
        # by the token passed to the action. We pass `secrets.GITHUB_TOKEN` by default,
        # so created PRs/commits will appear as `github-actions[bot]` (no personal PAT required).
        # If you later provide a personal token in `secrets.REGENERATE_TRIGGER_TOKEN`,
        # the PR would be created under that account instead.
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Regenerate trigger-weights"
          branch: "regenerate-trigger-weights/${{ github.run_id }}"
          title: "Regenerate trigger-weights"
          body: |
            Automated regeneration of `config/trigger-weights.json`.

            This PR is created by the scheduled workflow `regenerate-trigger-weights` and includes any changes detected to `config/trigger-weights.json`.
          labels: automated, regenerate-trigger-weights
          delete-branch: true
