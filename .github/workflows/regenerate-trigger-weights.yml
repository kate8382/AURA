name: Regenerate trigger-weights

on:
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Create a Pull Request when changes are detected (manual runs only)'
        required: false
        default: 'false'
  schedule:
    # weekly on Sunday at 03:00 UTC
    - cron: '0 3 * * 0'

# Minimal read permissions — workflow will not push or create PRs.
permissions:
  contents: read
  pull-requests: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate trigger weights
        run: npm run gen:triggers

      - name: Check for changes
        id: check_changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          git add config/trigger-weights.json || true
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Exit early when no changes
        if: steps.check_changes.outputs.changed == 'false'
        run: |
          echo "No changes detected; nothing to push or create. Exiting."
          exit 0

      # Pull request creation removed by request — scheduled runs will not push or create PRs.
