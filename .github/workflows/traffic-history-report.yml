name: Traffic History Report (CSV + PNG)

on:
  push:
    paths:
      - 'analytics/traffic-history.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-history-report
  cancel-in-progress: true

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Ensure backfill script is executable
        run: |
          chmod +x .github/scripts/backfill-traffic-history.js || true

      - name: Backfill per_day into daily entries
        run: |
          node .github/scripts/backfill-traffic-history.js

      - name: Generate CSV (images disabled)
        env:
          DISABLE_IMAGE_GEN: 'true'
        run: |
          node .github/scripts/generate-traffic-report.js

      - name: Generate traffic summary JSON
        run: |
          node .github/scripts/generate-traffic-summary.js

      - name: Commit changes
        id: commit_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/traffic-history.json analytics/traffic-summary.json analytics/traffic-history.csv || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "need_push=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update traffic data (auto)" --author "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            echo "need_push=true" >> $GITHUB_OUTPUT
          fi

      - name: Attempt push to main
        id: try_push
        if: steps.commit_changes.outputs.need_push == 'true'
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          set -e
          git remote set-url origin https://${TOKEN}@github.com/${REPO}.git
          if git push origin HEAD:main; then
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request for report updates
        if: steps.commit_changes.outputs.need_push == 'true' && steps.try_push.outputs.pushed != 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          commit-message: "Update traffic JSONs (auto)"
          title: "Update traffic JSONs (auto)"
          body: "Automated update of analytics JSON files (traffic history and summary)."
          branch: "auto/traffic-report-${{ github.run_id }}"
          base: "main"
          labels: automated,traffic-report

      - name: Auto-merge PR and delete branch
        if: steps.commit_changes.outputs.need_push == 'true' && steps.try_push.outputs.pushed != 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.TRAFFIC_TOKEN }}
          script: |
            const head = `auto/traffic-report-${process.env.GITHUB_RUN_ID}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: prs } = await github.rest.pulls.list({ owner, repo, head: `${owner}:${head}`, state: 'open' });
            if (!prs || prs.length === 0) {
              core.info(`No open PR found for ${head}`);
            } else {
              const pr = prs[0];
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'squash' });
                core.info(`Merged PR #${pr.number}`);
              } catch (err) {
                core.warning(`Merge failed: ${err}`);
              }
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${head}` });
                core.info(`Deleted branch ${head}`);
              } catch (err) {
                core.info(`Delete branch failed: ${err}`);
              }
            }
