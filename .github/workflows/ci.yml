name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate cases
        run: npm run validate

      - name: Validate real cases (skipped if empty)
        run: |
          if [ -d real_cases ] && [ -n "$(find real_cases -name '*.json' -print -quit)" ]; then
            npm run validate:real
          else
            echo "real_cases/ has no JSON cases yet; skipping real-case validation."
          fi

      - name: Check error handling
        run: npm run check:errors

      - name: Run tests
        run: npm test --silent
